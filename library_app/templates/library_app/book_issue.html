{% extends "library_app/base.html" %}
{% block content %}

<h3>Issue Book</h3>

<form method="post">
  {% csrf_token %}
  <div class="card p-4">
    {{ form.as_p }}

    <button class="btn btn-success">Confirm Issue</button>
    <a href="{% url 'books' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>

{% endblock %}
